services:
  postgres:
    image: postgres:17-alpine
    container_name: verce-postgres
    environment:
      POSTGRES_DB: verce
      POSTGRES_USER: verce
      POSTGRES_PASSWORD: verce_dev_only
    ports:
      - "5432:5432"
    volumes:
      - verce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verce -d verce"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["application"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Verce: Host=postgres;Port=5432;Database=verce;Username=verce;Password=verce_dev_only
      BrandAssets__StorageRoot: /var/lib/verce/brand-assets
      Documents__StorageRoot: /var/lib/verce/documents
      Settings__SeedOnStartup: "true"
      DataProtection__CurrentCertificatePath: /run/secrets/verce-dp.pfx
      DataProtection__CertificatePasswordFile: /run/secrets/verce-dp-password
    ports:
      - "8080:8080"
    volumes:
      - verce_brand_assets:/var/lib/verce/brand-assets
      - verce_documents:/var/lib/verce/documents
      - ${VERCE_DP_CERT_PATH:-./secrets/verce-dp.pfx}:/run/secrets/verce-dp.pfx:ro
      - ${VERCE_DP_PASSWORD_PATH:-./secrets/verce-dp-password}:/run/secrets/verce-dp-password:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  verce_postgres_data:
  verce_brand_assets:
  # ADR-0016: generated_document rows point at content-addressed HTML/PDF blobs stored here —
  # evidence (CLAUDE.md rule 13), never regenerable from the database alone. Persistent across
  # container recreation exactly like verce_brand_assets; see docs/OPERATIONS.md §4 for backup
  # coverage.
  verce_documents:
